{% extends "base.html" %}

{% block title %}404 - Страница не найдена{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="text-align: center; padding: 60px;">
        <h1 style="font-size: 100px; color: #4a6cf7; margin-bottom: 20px;">404</h1>
        <h2 style="margin-bottom: 20px;">Страница не найдена</h2>
        <p style="color: #666; margin-bottom: 30px; font-size: 18px;">
            Запрашиваемая страница не существует или была перемещена
        </p>
        <a href="{{ url_for('index') }}" class="btn" style="padding: 15px 40px; font-size: 18px;">
            На главную
        </a>
    </div>
</div>
{% endblock %}
