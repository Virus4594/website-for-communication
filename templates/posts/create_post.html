{% extends "base.html" %}

{% block title %}Создать пост - Messenger{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">Создать новый пост</h2>
        
        <form method="POST" action="{{ url_for('create_post') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="title">Заголовок:</label>
                <input type="text" id="title" name="title" class="form-control" 
                       maxlength="120" required
                       placeholder="Краткое описание поста">
                <small style="color: #666; font-size: 12px;">
                    Максимум 120 символов
                </small>
            </div>
            
            <div class="form-group">
                <label for="content">Содержание:</label>
                <textarea id="content" name="content" class="form-control" 
                          rows="10" required
                          placeholder="Расскажите что-нибудь интересное..."></textarea>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn" style="flex: 1;">
                    Опубликовать
                </button>
                <a href="{{ url_for('feed') }}" class="btn" 
                   style="background: #6c757d; flex: 1; text-align: center;">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
